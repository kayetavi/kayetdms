<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .glow { animation: glowFade 2s ease-in-out infinite; }
    @keyframes glowFade {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
  <rect width="1000" height="300" rx="25" fill="#0d6efd" />
  <circle cx="80" cy="80" r="30" fill="#ffffff33" class="glow" />
  <text x="50%" y="140" text-anchor="middle" font-size="40" fill="#fff" font-family="Segoe UI">API 571: Damage Mechanism Explorer</text>
  <text x="50%" y="180" text-anchor="middle" font-size="20" fill="#cfe9ff">Identify, understand, and track failure mechanisms</text>
</svg>
